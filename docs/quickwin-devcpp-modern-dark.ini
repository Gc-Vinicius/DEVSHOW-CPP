; ============================================================================
; Quick-Win para Dev-C++ 5.11 Atual (Trilha A — Somente referência)
; NÃO substitui o arquivo inteiro: aplique apenas as seções abaixo no seu
; C:\Users\vineee\AppData\Roaming\Dev-Cpp\devcpp.ini (faça backup antes!).
;
; Melhorias aplicadas dentro dos limites do Dev-C++ 5.11 VCL:
;  1. Reduz de 8 toolbars para 3 essenciais (Main, Compile, Compilers).
;  2. Substitui Courier New 10pt por Consolas 11pt (nativa do Windows).
;  3. Corrige contraste WCAG no tema escuro (remove clBlue sobre clBlack).
;  4. Escurece a cor de fundo do popup de CodeCompletion (de clWindow branco).
;  5. Alarga o painel de projeto (161px -> 230px) e desativa MultiLineTab.
; ============================================================================

[Options]
InterfaceFont="Segoe UI"
InterfaceFontSize=9
MultiLineTab=0
ProjectWidth=230
OutputHeight=170
; Mantém apenas as 3 toolbars mais úteis (reduz poluição visual de 2 linhas para 1)
ToolbarMain=1
ToolbarCompile=1
ToolbarCompilers=1
ToolbarEdit=0
ToolbarProject=0
ToolbarSearch=0
ToolbarSpecials=0
ToolbarClasses=0

[Editor]
TabSize=4
MarginVis=1
MarginSize=100
HighCurrLine=1
; Linha ativa sutil em cinza-azulado escuro (#1E2433 em BGR = $0033241E)
HighColor=3351582

[Editor.Font]
Name="Consolas"
Size=11
Height=-15

[Editor.Gutterfont]
Name="Consolas"
Size=10
Height=-13

; Cores em formato Delphi BGR ($00BBGGRR) — Paleta Obsidian Slate Acessível
[Editor.Syntax]
Assembler=$00F8BD38, clNone, 0, 0, 0
Character=$0080DE4A, clNone, 0, 0, 0
Comment=$0081766E, clNone, 0, 1, 0
Float=$003C92FB, clNone, 0, 0, 0
Hexadecimal=$003C92FB, clNone, 0, 0, 0
Identifier=$00F3EDE6, clNone, 0, 0, 0
Illegal Char=$004444EF, $001B1B45, 1, 0, 0
Number=$003C92FB, clNone, 0, 0, 0
Octal=$003C92FB, clNone, 0, 0, 0
Preprocessor=$00B672F4, clNone, 0, 0, 0
Reserved Word=$00FC84C0, clNone, 1, 0, 0
Space=$00F3EDE6, $0017110F, 0, 0, 0
String=$0080DE4A, clNone, 0, 0, 0
Symbol=$00C5B8A8, clNone, 0, 0, 0
; Breakpoints (texto branco, fundo vermelho escuro)
Breakpoints=16777215, 2236996
; Error line (texto branco, fundo carmesim)
Error line=16777215, 2960815
; Active breakpoints (texto branco, fundo âmbar escuro)
Active breakpoints=16777215, 1662072
; Gutter (texto cinza-azulado, fundo #161922)
Gutter=10392715, 2234646
; Selected text (texto claro, seleção azul escuro)
Selected text=16777215, 7815206
; Folding lines
Folding lines=7365225, 2234646

[CodeCompletion]
Width=380
Height=260
Delay=120
; Fundo escuro #1E2230 em BGR (corrige popup branco ofuscante)
BackColor=3154462
Enabled=1
